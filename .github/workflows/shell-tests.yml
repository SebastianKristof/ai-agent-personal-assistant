name: Shell Script Tests

on:
  push:
    paths:
      - 'src/scripts/**'
      - 'test/**'
  pull_request:
    paths:
      - 'src/scripts/**'
      - 'test/**'

jobs:
  bats-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Bats
        run: |
          # Install Bats properly in GitHub Actions
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          ./install.sh $HOME
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Run Bats tests
        run: |
          bats --version
          bats test/*.bats 